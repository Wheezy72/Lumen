name: QA

on:
  push:
  pull_request:

jobs:
  backend_static_checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: node --check src/index.js
        run: node --check src/index.js
      - name: node --check src/queue/index.js
        run: node --check src/queue/index.js

  python_compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: py_compile python/worker.py
        run: python -m py_compile python/worker.py

  frontend_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
