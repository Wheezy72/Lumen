$kind: http-request
name: Start a Scan
url: "{{baseUrl}}/api/publicApi/scans"
method: POST
headers:
  - name: Content-Type
    value: application/json
  - name: Authorization
    value: "Bearer {{publicApiKey}}"
body:
  mode: raw
  raw: |
    {
      "target": "https://example.com",
      "modules": ["headers", "xss", "sqli", "cookies", "ssl", "rate_limit"]
    }
order: 1000
