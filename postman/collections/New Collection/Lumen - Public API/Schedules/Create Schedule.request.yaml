$kind: http-request
name: Create Schedule
url: "{{baseUrl}}/api/publicApi/schedules"
method: POST
headers:
  - name: Content-Type
    value: application/json
  - name: Authorization
    value: "Bearer {{publicApiKey}}"
body:
  mode: raw
  raw: |
    {
      "target": "https://example.com",
      "cron": "0 9 * * 1",
      "timezone": "Africa/Nairobi",
      "modules": ["headers", "xss", "sqli", "cookies", "ssl"],
      "runNow": false
    }
order: 1000
